<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Puntaje Ideal</title>
<style>
body{font-family:Arial;background:#0f1115;color:white;padding:20px}
.container{max-width:700px;margin:auto;background:#181c23;padding:20px;border-radius:12px}
input,select,button,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0}
button{background:#0d47a1;color:white;font-weight:bold;cursor:pointer}
textarea{height:220px;background:#111827;color:#facc15}
h1{color:#facc15}
a{color:#facc15}
</style>
</head>
<body>

<div class="container">
<h1>Panel Admin - Puntaje Ideal</h1>
<p>Generador de partidos para partidos.json</p>

<input id="hora" placeholder="Hora: 15:00">
<input id="liga" placeholder="Liga: Liga 1">
<input id="local" placeholder="Equipo local">
<input id="visitante" placeholder="Equipo visitante">
<input id="canal" placeholder="Canal TV">
<input id="pronostico" placeholder="Pronóstico: Over 1.5">

<select id="estado">
<option value="PROXIMO">PROXIMO</option>
<option value="EN VIVO">EN VIVO</option>
<option value="FINAL">FINAL</option>
</select>

<button onclick="generarJSON()">Generar JSON</button>
<button onclick="copiarJSON()">Copiar JSON</button>

<textarea id="resultado" readonly></textarea>

<p><a href="index.html">Volver a la web</a></p>
</div>

<script>
function generarJSON(){
  const partido = {
    hora: document.getElementById("hora").value,
    liga: document.getElementById("liga").value,
    local: document.getElementById("local").value,
    visitante: document.getElementById("visitante").value,
    canal: document.getElementById("canal").value,
    pronostico: document.getElementById("pronostico").value,
    estado: document.getElementById("estado").value
  };

  document.getElementById("resultado").value =
    JSON.stringify(partido, null, 2);
}

function copiarJSON(){
  const texto = document.getElementById("resultado");
  texto.select();
  document.execCommand("copy");
  alert("JSON copiado");
}
</script>

</body>
</html>
