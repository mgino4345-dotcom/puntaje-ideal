<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Puntaje Ideal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',Arial,sans-serif}
body{background:#0f1115;color:#e8e8e8;padding:20px}
.container{max-width:1100px;margin:auto}
.admin-card{background:#111827;border:1px solid #334155;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.admin-head{background:#1f2937;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
.admin-head h1{font-size:24px;color:#fff}
.admin-head a{color:#facc15;text-decoration:none;font-weight:700}
.admin-body{padding:22px}
.section-title{color:#facc15;font-size:15px;font-weight:800;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid #334155}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#3b82f6}
button{height:46px;border:0;padding:12px 14px;border-radius:10px;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.btn-primary{background:#0d47a1}
.btn-api{background:#16a34a;box-shadow:0 0 15px rgba(34,197,94,.25)}
.btn-copy{background:#ca8a04}
.btn-clean{background:#374151}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.preview{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.preview-card,.ia-preview,.preview-match{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:18px}
.preview-card{min-height:120px;text-align:center}
.preview-card img{max-width:60px;height:60px;object-fit:contain;margin-top:10px}
.ia-preview{margin-top:12px;color:#fff;font-weight:800;line-height:1.6}
.ia-preview strong{color:#facc15}
.preview-match{margin-top:15px;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
textarea{min-height:300px;color:#facc15;font-family:monospace}
@media(max-width:800px){
  .grid,.grid-3,.actions,.preview{grid-template-columns:1fr}
  .admin-head{flex-direction:column;gap:10px;align-items:flex-start}
}
</style>
</head>

<body>

<div class="container">
  <div class="admin-card">

    <div class="admin-head">
      <h1>⚙️ Admin Puntaje Ideal</h1>
      <a href="index.html">← Volver a la web</a>
    </div>

    <div class="admin-body">

      <p>Generador limpio para partidos.json</p>

      <h2 class="section-title">📅 Datos del partido</h2>

      <div class="grid-3">
        <input id="fecha" placeholder="Fecha: 01/06/2026">
        <input id="hora" placeholder="Hora: 15:00">
        <input id="liga" placeholder="Liga: Liga 1">
      </div>

      <div class="grid">
        <input id="pais" placeholder="País/Bandera: 🇵🇪">
        <input id="canal" placeholder="Canal TV: ESPN, L1 MAX, Disney+">
      </div>

      <h2 class="section-title">⚽ Equipos</h2>

      <div class="grid">
        <input id="local" placeholder="Equipo local">
        <input id="visitante" placeholder="Equipo visitante">
      </div>

      <button type="button" class="btn-api" onclick="buscarEscudosAPI()">🔍 Buscar escudos con API</button>

      <div class="grid">
        <input id="escudoLocal" placeholder="Escudo local">
        <input id="escudoVisitante" placeholder="Escudo visitante">
      </div>

      <div class="preview">
        <div class="preview-card">
          <strong>Escudo local</strong><br>
          <img id="previewLocal" src="" alt="">
        </div>

        <div class="preview-card">
          <strong>Escudo visitante</strong><br>
          <img id="previewVisitante" src="" alt="">
        </div>
      </div>

      <h2 class="section-title">📊 Marcador y estado</h2>

      <div class="grid-3">
        <input id="golesLocal" type="number" placeholder="Goles local">
        <input id="golesVisitante" type="number" placeholder="Goles visitante">

        <select id="estado">
          <option value="PROXIMO">PROXIMO</option>
          <option value="LIVE">LIVE</option>
          <option value="FINAL">FINAL</option>
        </select>
      </div>

      <div class="grid-3">
        <input id="minuto" placeholder="Minuto: 1T 34' / MT / 2T 67'">
        <input id="ht" placeholder="HT: 0-0">
        <input id="corners" placeholder="Corners: 3-2">
      </div>

      <div class="grid">
        <input id="rojaLocal" type="number" placeholder="Rojas local">
        <input id="rojaVisitante" type="number" placeholder="Rojas visitante">
      </div>

      <h2 class="section-title">🤖 Pronóstico IA</h2>

      <div class="grid-3">
        <select id="nivelPick">
          <option value="🟢 PICK FUERTE">🟢 PICK FUERTE</option>
          <option value="🟡 PICK MEDIO">🟡 PICK MEDIO</option>
          <option value="🔴 EVITAR">🔴 EVITAR</option>
        </select>

        <input id="mercadoIA" placeholder="Mercado IA: Over 1.5">
        <input id="confianza" type="number" placeholder="Confianza: 82">
      </div>

      <div class="grid">
        <input id="cuota" type="number" step="0.01" placeholder="Cuota sugerida: 1.30">

        <button class="btn-api" type="button" onclick="autocompletarIA()">🤖 Auto IA</button>
      </div>

      <div id="previewIA" class="ia-preview">🤖 Pronóstico IA pendiente</div>

      <h2 class="section-title">🔥 Pronóstico manual</h2>

      <div class="grid">
        <input id="pronostico" placeholder="Pronóstico: Over 1.5">

        <select id="pickIA">
          <option value="🟢 PICK FUERTE">🟢 PICK FUERTE</option>
          <option value="🟡 PICK MEDIO">🟡 PICK MEDIO</option>
          <option value="🔴 EVITAR">🔴 EVITAR</option>
        </select>
      </div>

      <div id="previewPartido"></div>

      <div class="actions">
        <button class="btn-primary" onclick="generarJSON()">Generar JSON</button>
        <button class="btn-copy" onclick="copiarJSON()">Copiar JSON</button>
        <button class="btn-clean" onclick="limpiar()">Limpiar</button>
        <button class="btn-api" onclick="descargarJSON()">Descargar JSON</button>
      </div>

      <textarea id="resultado" readonly></textarea>

    </div>
  </div>
</div>

<script>
function valorONull(id){
  const valor = document.getElementById(id).value;
  return valor === "" ? null : Number(valor);
}

function autocompletarIA(){
  const estado = document.getElementById("estado").value;
  const liga = document.getElementById("liga").value.toLowerCase();
  const golesLocal = Number(document.getElementById("golesLocal").value || 0);
  const golesVisitante = Number(document.getElementById("golesVisitante").value || 0);
  const totalGoles = golesLocal + golesVisitante;

  let nivel = "🔴 EVITAR";
  let mercado = "Sin entrada clara";
  let confianza = 45;
  let cuota = 0;

  if(estado === "FINAL"){
    nivel = "⚫ FINALIZADO";
    mercado = "Sin pick";
    confianza = 0;
    cuota = 0;
  }else if(estado === "LIVE" && totalGoles >= 1){
    nivel = "🟢 PICK FUERTE";
    mercado = "Over 1.5";
    confianza = 82;
    cuota = 1.30;
  }else if(liga.includes("juvenil") || liga.includes("u19") || liga.includes("sub")){
    nivel = "🟢 PICK FUERTE";
    mercado = "Over 1.5";
    confianza = 78;
    cuota = 1.32;
  }else if(liga.includes("brasil") || liga.includes("serie a")){
    nivel = "🟡 PICK MEDIO";
    mercado = "Over 1.5";
    confianza = 68;
    cuota = 1.35;
  }

  document.getElementById("nivelPick").value = nivel;
  document.getElementById("mercadoIA").value = mercado;
  document.getElementById("confianza").value = confianza;
  document.getElementById("cuota").value = cuota;

  mostrarPreviewIA();
}

function mostrarPreviewIA(){
  const nivel = document.getElementById("nivelPick").value;
  const mercado = document.getElementById("mercadoIA").value || "-";
  const confianza = document.getElementById("confianza").value || "-";
  const cuota = document.getElementById("cuota").value || "-";
  const liga = document.getElementById("liga").value || "-";

  document.getElementById("previewIA").innerHTML = `
    <strong>🤖 Pronóstico IA Completo</strong><br>
    ${nivel}<br>
    Mercado: ${mercado}<br>
    Confianza: ${confianza}%<br>
    Liga: ${liga}<br>
    Cuota sugerida: ${cuota}
  `;
}

function generarJSON(){
  const estado = document.getElementById("estado").value;

  let golesLocal = valorONull("golesLocal");
  let golesVisitante = valorONull("golesVisitante");

  if(estado === "PROXIMO"){
    golesLocal = null;
    golesVisitante = null;
  }

  const local = document.getElementById("local").value;
  const visitante = document.getElementById("visitante").value;

  const partido = {
    fecha: document.getElementById("fecha").value,
    hora: document.getElementById("hora").value,
    pais: document.getElementById("pais").value,
    liga: document.getElementById("liga").value,

    local,
    visitante,

    escudoLocal: document.getElementById("escudoLocal").value,
    escudoVisitante: document.getElementById("escudoVisitante").value,

    golesLocal,
    golesVisitante,
    estado,

    minuto: document.getElementById("minuto").value,
    ht: document.getElementById("ht").value,
    corners: document.getElementById("corners").value,

    rojaLocal: Number(document.getElementById("rojaLocal").value || 0),
    rojaVisitante: Number(document.getElementById("rojaVisitante").value || 0),

    canal: document.getElementById("canal").value,
    pronostico: document.getElementById("pronostico").value,
    pickIA: document.getElementById("pickIA").value,

    nivelPick: document.getElementById("nivelPick").value,
    mercadoIA: document.getElementById("mercadoIA").value,
    confianza: Number(document.getElementById("confianza").value || 0),
    cuota: Number(document.getElementById("cuota").value || 0)
  };

  document.getElementById("resultado").value = JSON.stringify(partido, null, 2);

  document.getElementById("previewPartido").innerHTML = `
    <div class="preview-match">
      <span>${local || "Local"}</span>
      <strong>${golesLocal ?? "-"} - ${golesVisitante ?? "-"}</strong>
      <span>${visitante || "Visitante"}</span>
    </div>
  `;
}

function copiarJSON(){
  const texto = document.getElementById("resultado");
  texto.select();
  document.execCommand("copy");
  alert("JSON copiado");
}

function descargarJSON(){
  const contenido = document.getElementById("resultado").value;

  if(!contenido){
    alert("Primero genera el JSON");
    return;
  }

  const blob = new Blob([contenido], {type:"application/json"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "partido.json";
  a.click();

  URL.revokeObjectURL(url);
}

function limpiar(){
  document.querySelectorAll("input").forEach(input => input.value = "");
  document.getElementById("estado").value = "PROXIMO";
  document.getElementById("pickIA").value = "🟢 PICK FUERTE";
  document.getElementById("nivelPick").value = "🟢 PICK FUERTE";
  document.getElementById("resultado").value = "";
  document.getElementById("previewIA").innerHTML = "🤖 Pronóstico IA pendiente";
  document.getElementById("previewPartido").innerHTML = "";
  document.getElementById("previewLocal").src = "";
  document.getElementById("previewVisitante").src = "";
}

function buscarEscudosAPI(){
  const local = document.getElementById("local").value.trim();
  const visitante = document.getElementById("visitante").value.trim();

  if(!local || !visitante){
    alert("Escribe primero el equipo local y visitante");
    return;
  }

  buscarEscudoEquipo(local, "escudoLocal", "previewLocal");
  buscarEscudoEquipo(visitante, "escudoVisitante", "previewVisitante");
}

function normalizarTexto(texto){
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function buscarEscudoEquipo(nombreEquipo, campoDestino, previewDestino){
  const equipo = encodeURIComponent(nombreEquipo);
  const url = `https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t=${equipo}`;

  fetch(url)
    .then(response => response.json())
    .then(data => {
      const campo = document.getElementById(campoDestino);
      const preview = document.getElementById(previewDestino);

      campo.value = "";
      preview.src = "";

      if(data.teams && data.teams.length > 0){
        const nombreBuscado = normalizarTexto(nombreEquipo);

        const equipoExacto = data.teams.find(team =>
          normalizarTexto(team.strTeam) === nombreBuscado
        );

        const equipoElegido = equipoExacto || data.teams[0];

        if(equipoElegido && equipoElegido.strBadge){
          campo.value = equipoElegido.strBadge;
          preview.src = equipoElegido.strBadge;
        }else{
          alert(`No se encontró escudo para: ${nombreEquipo}`);
        }
      }else{
        alert(`No se encontró escudo para: ${nombreEquipo}`);
      }
    })
    .catch(error => {
      console.error(error);
      alert(`Error consultando TheSportsDB para: ${nombreEquipo}`);
    });
}
</script>

</body>
</html>
